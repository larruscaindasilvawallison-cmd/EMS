:root{
  --bg:#f3f3f4; --surface:#ffffff; --surface2:#ececee; --ink:#17171a; --muted:#68686f; --line:#dedee2;
  --accent:#c1121f; --accent-ink:#ffffff; --accent-soft:#fbe3e5;
  --good:#17714a; --good-bg:#e0f2e8; --warn:#8a5a00; --warn-bg:#fbefc8; --bad:#b3121f; --bad-bg:#fde3e4; --info:#45454d; --info-bg:#e9e9ec; --idle:#68686f; --idle-bg:#efeff1;
  --shadow:0 1px 2px rgba(16,16,20,.05),0 1px 3px rgba(16,16,20,.07);
  --font:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:var(--font);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d0d0f; --surface:#161619; --surface2:#1f1f23; --ink:#ededf0; --muted:#9a9aa3; --line:#2a2a30;
    --accent:#ef4455; --accent-ink:#1d0508; --accent-soft:#3a1519;
    --good:#5cd194; --good-bg:#12301f; --warn:#f2c34f; --warn-bg:#352a0b; --bad:#ff7b86; --bad-bg:#3b1519; --info:#b8b8c0; --info-bg:#27272c; --idle:#9a9aa3; --idle-bg:#222226;
    --shadow:0 1px 2px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d0d0f; --surface:#161619; --surface2:#1f1f23; --ink:#ededf0; --muted:#9a9aa3; --line:#2a2a30;
  --accent:#ef4455; --accent-ink:#1d0508; --accent-soft:#3a1519;
  --good:#5cd194; --good-bg:#12301f; --warn:#f2c34f; --warn-bg:#352a0b; --bad:#ff7b86; --bad-bg:#3b1519; --info:#b8b8c0; --info-bg:#27272c; --idle:#9a9aa3; --idle-bg:#222226;
  --shadow:0 1px 2px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);font-variant-numeric:tabular-nums}
.page{padding:14px 20px 28px;display:flex;flex-direction:column;gap:14px;max-width:1500px;margin:0 auto}
.phrow{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.ph h1{margin:0;font-size:24px;letter-spacing:-.02em;font-weight:700}
.ph p{margin:2px 0 0;color:var(--muted);font-size:13px}
.sp{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 12px;border-radius:8px;font:600 13px var(--font);cursor:pointer;box-shadow:var(--shadow);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:3px 8px;font-size:12px;box-shadow:none}
.btn.dng:hover{border-color:var(--bad);color:var(--bad)}
.safe{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.safe .dot{width:8px;height:8px;border-radius:50%;background:var(--good)}
.safe.warn .dot{background:var(--warn)}
.banner{padding:10px 14px;border-radius:10px;font-size:13px;background:var(--warn-bg);color:var(--warn);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner b{font-weight:700}
.tabs{display:flex;gap:4px;padding:3px;background:var(--surface2);border-radius:10px;width:fit-content}
.tab{border:0;background:transparent;color:var(--muted);padding:7px 16px;border-radius:7px;font:600 13px var(--font);cursor:pointer}
.tab[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;box-shadow:var(--shadow)}
.kpi.acc{border-left:3px solid var(--accent)}
.kpi .l{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.02em;text-transform:uppercase}
.kpi .v{font-size:22px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.kpi .v small{font-size:12.5px;color:var(--muted);margin-right:3px}
.kpi .n{font-size:12px;color:var(--muted)}
.kpi.bad .v{color:var(--bad)} .kpi.warn .v{color:var(--warn)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:14px 16px;min-width:0}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
input,select,textarea{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 10px;font:inherit;font-size:13.5px;width:100%}
.tools input,.tools select{width:auto}
.tools input[type=search]{min-width:240px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.cnt{color:var(--muted);font-size:12.5px}
.tablebox{overflow:auto;max-height:calc(100vh - 360px);min-height:140px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{position:sticky;top:0;background:var(--surface);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
td.nw{white-space:nowrap}
tfoot td{font-weight:700;border-top:2px solid var(--line);border-bottom:0;position:sticky;bottom:0;background:var(--surface)}
.act{white-space:nowrap;text-align:right}
.late{color:var(--bad);font-weight:700}
.muted{color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:999px;font-size:10.5px;font-weight:700;letter-spacing:.03em;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-good{background:var(--good-bg);color:var(--good)}.p-warn{background:var(--warn-bg);color:var(--warn)}.p-bad{background:var(--bad-bg);color:var(--bad)}.p-idle{background:var(--idle-bg);color:var(--idle)}
.p-nf{background:transparent;color:var(--warn);box-shadow:inset 0 0 0 1px var(--warn)}
.empty{padding:50px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto;z-index:40}
.ov[hidden]{display:none}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.4);width:100%;max-width:560px;padding:18px 20px}
.modal h3{margin:0 0 12px;font-size:17px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fg .full{grid-column:1/-1}
.fld label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:3px}
.fld .h{font-size:11.5px;color:var(--muted);margin-top:2px}
.mb{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.warnbox{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:7px 10px;font-size:12.5px;margin-top:10px}
.lg{width:26px;height:26px;border-radius:6px;object-fit:contain;background:#fff;border:1px solid var(--line);padding:2px;vertical-align:middle;flex:none}
.av{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:6px;background:var(--surface2);color:var(--muted);font-size:12px;font-weight:700;vertical-align:middle;flex:none}
.fn{display:inline-flex;align-items:center;gap:8px}
.lgbox{display:flex;align-items:center;gap:12px}
.lgbox .lg,.lgbox .av{width:56px;height:56px;border-radius:10px;font-size:20px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:9px;font-size:13px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.3);display:none;z-index:60}
@media (max-width:560px){.fg{grid-template-columns:1fr}.page{padding:12px}}
</style>
</head>
<body>
<div class="page" id="app"></div>
<div class="ov" id="ov" hidden><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<input type="file" id="fileIn" accept="application/json,.json" hidden>
<div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=new Intl.NumberFormat('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const fm=v=>nf.format(v||0);
const pad=n=>String(n).padStart(2,'0');
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const fd=iso=>iso?iso.split('-').reverse().join('/'):'';
const dd=(a,b)=>Math.round((Date.UTC(+a.slice(0,4),+a.slice(5,7)-1,+a.slice(8,10))-Date.UTC(+b.slice(0,4),+b.slice(5,7)-1,+b.slice(8,10)))/864e5);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const parseMoney=v=>{let s=String(v??'').replace(/[^\d.,-]/g,'');if(!s)return null;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');const n=Number(s);return isFinite(n)?n:null};
function theme(t){if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);else document.documentElement.removeAttribute('data-theme')}
(function(){let t=null;try{t=localStorage.getItem('ems.theme')}catch(e){}theme(t);try{const p=window.parent.document.documentElement.getAttribute('data-theme');if(p)theme(p)}catch(e){}})();
addEventListener('message',e=>{const d=e.data;if(d&&(d.theme||d.emsTheme||d.ems_theme))theme(d.theme||d.emsTheme||d.ems_theme)});
let tT;function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(tT);tT=setTimeout(()=>t.style.display='none',2800)}

/* ===================== ARMAZENAMENTO (à prova de limpeza do navegador) =====================
   1) IndexedDB  2) localStorage (cópia)  3) pedido de armazenamento persistente
   4) Backup em arquivo (.json) manual  5) Arquivo vinculado, regravado a cada alteração (Chrome/Edge) */
const KEY='ems.req.v1',IDBN='ems_requisicoes';
const TIPOS0=['Frete internacional','Frete rodoviário','Despacho aduaneiro','Seguro','Armazenagem','Certificação','Outros'];
let D={v:1,forn:[],req:[],_saved:0,lastBackup:''};
const idb=()=>new Promise((ok,no)=>{try{const r=indexedDB.open(IDBN,1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}catch(e){no(e)}});
async function kvGet(k){try{const db=await idb();return await new Promise((ok,no)=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)})}catch(e){return undefined}}
async function kvSet(k,v){try{const db=await idb();await new Promise((ok,no)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=ok;t.onerror=()=>no(t.error)});return true}catch(e){return false}}
let fileH=null,fileOK=false,fileErr='';
async function writeFile(){
  if(!fileH)return;
  try{const w=await fileH.createWritable();await w.write(JSON.stringify(D,null,1));await w.close();fileOK=true;fileErr='';D.lastBackup=new Date().toISOString();await kvSet('data',D);try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}}
  catch(e){fileOK=false;fileErr=String(e&&e.name||e)}
}
let wT;
function commit(){
  D._saved=Date.now();
  kvSet('data',D);try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}
  if(fileH){clearTimeout(wT);wT=setTimeout(async()=>{await writeFile();barra()},600)}
  barra();
}
async function boot(){
  let a=null,b=null;
  a=await kvGet('data');try{b=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  const pick=[a,b].filter(x=>x&&Array.isArray(x.req)&&Array.isArray(x.forn)).sort((x,y)=>(y._saved||0)-(x._saved||0))[0];
  if(pick)D=pick;
  D.lastBackup=D.lastBackup||'';
  try{if(navigator.storage&&navigator.storage.persist)await navigator.storage.persist()}catch(e){}
  fileH=(await kvGet('fileHandle'))||null;
  if(fileH){try{const p=await fileH.queryPermission({mode:'readwrite'});fileOK=p==='granted'}catch(e){fileOK=false}}
  render();
}
function baixarBackup(){
  const blob=new Blob([JSON.stringify(D,null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='requisicoes-backup-'+todayISO()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  D.lastBackup=new Date().toISOString();commit();toast('Backup baixado. Guarde o arquivo em uma pasta segura.');
}
async function vincular(){
  if(!window.showSaveFilePicker){toast('Este navegador não permite arquivo automático. Use "Baixar backup".');return}
  try{
    const h=await showSaveFilePicker({suggestedName:'requisicoes-ems.json',types:[{description:'Backup EMS (JSON)',accept:{'application/json':['.json']}}]});
    fileH=h;await kvSet('fileHandle',h);await writeFile();barra();toast(fileOK?'Arquivo vinculado: cada alteração será salva nele também.':'Não foi possível gravar no arquivo.');
  }catch(e){if(e&&e.name!=='AbortError')toast('Não foi possível vincular o arquivo.')}
}
async function reativar(){
  try{const p=await fileH.requestPermission({mode:'readwrite'});if(p==='granted'){await writeFile();barra();toast('Backup automático reativado.')}}catch(e){toast('Não foi possível reativar.')}
}
function importar(txt){
  let o;try{o=JSON.parse(txt)}catch(e){toast('Arquivo inválido.');return}
  if(!o||!Array.isArray(o.req)||!Array.isArray(o.forn)){toast('Este arquivo não é um backup de .');return}
  modal('<h3>Importar backup</h3><p>O arquivo tem <b>'+o.req.length+' requisições</b> e <b>'+o.forn.length+' fornecedores</b>. O que fazer?</p><div class="mb"><button class="btn" id="mx">Cancelar</button><button class="btn" id="mm">Mesclar (só adicionar o que falta)</button><button class="btn primary" id="mr">Substituir tudo</button></div>');
  $('#mx').onclick=fechar;
  $('#mr').onclick=()=>{D={v:1,forn:o.forn,req:o.req,_saved:0,lastBackup:D.lastBackup};commit();fechar();render();toast('Backup restaurado.')};
  $('#mm').onclick=()=>{const fi=new Set(D.forn.map(x=>x.id)),ri=new Set(D.req.map(x=>x.id));o.forn.forEach(x=>{if(!fi.has(x.id))D.forn.push(x)});o.req.forEach(x=>{if(!ri.has(x.id))D.req.push(x)});commit();fechar();render();toast('Backup mesclado.')};
}
$('#fileIn').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(f)importar(await f.text())};

/* ===================== regras ===================== */
const HOM={sim:['Homologado','p-good'],analise:['Em análise','p-warn'],nao:['Não homologado','p-bad']};
const fornById=id=>D.forn.find(f=>f.id===id);
const avatar=f=>!f?'':f.logo?'<img class="lg" src="'+esc(f.logo)+'" alt="">':'<span class="av" aria-hidden="true">'+esc((f.nome||'?').trim().charAt(0).toUpperCase())+'</span>';
function reduzir(file,max){return new Promise((ok,no)=>{const fr=new FileReader();fr.onerror=()=>no();fr.onload=()=>{const im=new Image();im.onerror=()=>no();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),w=Math.max(1,Math.round(im.width*k)),h=Math.max(1,Math.round(im.height*k)),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');const jpg=/jpe?g/i.test(file.type);if(jpg){x.fillStyle='#fff';x.fillRect(0,0,w,h)}x.drawImage(im,0,0,w,h);ok(c.toDataURL(jpg?'image/jpeg':'image/png',.85))};im.src=fr.result};fr.readAsDataURL(file)})}
const tiposUsados=()=>[...new Set([...TIPOS0,...D.forn.flatMap(f=>f.tipos||[]),...D.req.map(r=>r.tipo)].filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
function sit(r){
  if(r.pago)return ['Pago','p-good',4];
  const h=todayISO();
  if(r.venc&&r.venc<h)return ['Vencida','p-bad',1];
  if(r.venc&&dd(r.venc,h)<=7)return ['Vence em breve','p-warn',2];
  if(!r.prev)return ['Sem previsão','p-idle',3];
  return ['Em dia','p-idle',3];
}
let tab='req',F={q:'',s:'',m:''},FF={q:'',h:''};
function render(){
  const A=$('#app');
  A.innerHTML='<div class="phrow"><div class="ph"><h1>Requisições de compras</h1></div><div class="sp"></div>'+
   '<button class="btn" id="bBk" title="Backup e restauração">Backup</button><button class="btn primary" id="bNew">'+(tab==='req'?'Nova requisição':'Novo fornecedor')+'</button></div>'+
   '<div id="safe"></div><div id="bn"></div>'+
   '<div class="tabs" role="tablist"><button class="tab" data-t="req" aria-pressed="'+(tab==='req')+'"></button><button class="tab" data-t="forn" aria-pressed="'+(tab==='forn')+'">Fornecedores</button></div>'+
   '<div id="body"></div>';
  A.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
  $('#bNew').onclick=()=>tab==='req'?formReq():formForn();
  $('#bBk').onclick=menuBackup;
  barra();tab==='req'?viewReq():viewForn();
}
function barra(){
  const s=$('#safe');if(!s)return;
  const lb=D.lastBackup?new Date(D.lastBackup):null,dias=lb?Math.floor((Date.now()-lb)/864e5):null,tem=D.req.length+D.forn.length>0;
  let h='<div class="safe'+(tem&&(dias==null||dias>7)&&!fileOK?' warn':'')+'"><span class="dot"></span>Salvo automaticamente neste navegador'+(fileH?(fileOK?' · <b>e no arquivo vinculado</b>':' · arquivo vinculado <b>pausado</b> <button class="btn sm" id="bRe">Reativar</button>'):'')+
    ' · último backup: '+(lb?lb.toLocaleDateString('pt-BR')+' '+lb.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):'nunca')+'</div>';
  s.innerHTML=h;const b=$('#bRe');if(b)b.onclick=reativar;
  const bn=$('#bn');if(bn)bn.innerHTML=tem&&!fileOK&&(dias==null||dias>7)?'<div class="banner"><span><b>Faça um backup.</b> O navegador pode apagar os dados do site. Baixe uma cópia ou vincule um arquivo para salvar automaticamente.</span><button class="btn sm" id="bB1">Baixar backup</button>'+(window.showSaveFilePicker?'<button class="btn sm" id="bB2">Vincular arquivo</button>':'')+'</div>':'';
  const b1=$('#bB1');if(b1)b1.onclick=baixarBackup;const b2=$('#bB2');if(b2)b2.onclick=vincular;
}
function menuBackup(){
  modal('<h3>Backup</h3><p class="muted" style="margin-top:0">Os dados ficam guardados no navegador, mas o Chrome pode limpá-los. Mantenha uma cópia fora dele.</p>'+
   '<div style="display:flex;flex-direction:column;gap:8px"><button class="btn" id="k1"><b>Baixar backup agora</b> (arquivo .json)</button>'+
   (window.showSaveFilePicker?'<button class="btn" id="k2"><b>'+(fileH?'Trocar o arquivo vinculado':'Vincular um arquivo')+'</b> (salva sozinho a cada alteração)</button>':'')+
   '<button class="btn" id="k3"><b>Restaurar de um backup</b> (.json)</button><button class="btn" id="k4">Exportar  para Excel (.csv)</button></div><div class="mb"><button class="btn" id="kx">Fechar</button></div>');
  $('#k1').onclick=()=>{baixarBackup();fechar()};const k2=$('#k2');if(k2)k2.onclick=async()=>{fechar();await vincular()};
  $('#k3').onclick=()=>{fechar();$('#fileIn').click()};$('#k4').onclick=()=>{csv();fechar()};$('#kx').onclick=fechar;
}
function csv(){
  const L=[['Fornecedor','Fatura','Nº requisição SAP','Tipo de serviço','Valor (R$)','Vencimento','Previsão de pagamento','Pago em','Situação','Observação']];
  D.req.slice().sort((a,b)=>(a.venc||'9')<(b.venc||'9')?-1:1).forEach(r=>{const f=fornById(r.forn);L.push([f?f.nome:'',r.fat,r.sap||'',r.tipo,String(r.valor).replace('.',','),fd(r.venc),fd(r.prev),fd(r.pago),sit(r)[0],r.obs||''])});
  const t='﻿'+L.map(l=>l.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv;charset=utf-8'}));a.download='requisicoes-'+todayISO()+'.csv';document.body.appendChild(a);a.click();a.remove();
}
/* -----  ----- */
function viewReq(){
  const B=$('#body');
  if(!D.req.length){B.innerHTML='<div class="card empty"><b>Nenhuma requisição registrada</b>'+(D.forn.length?'':'Comece cadastrando os fornecedores na aba <b>Fornecedores</b>. ')+'Depois clique em <b>Nova requisição</b> para registrar uma fatura.</div>';return}
  const h=todayISO(),ab=D.req.filter(r=>!r.pago),venc=ab.filter(r=>r.venc&&r.venc<h),mes=h.slice(0,7),doMes=ab.filter(r=>(r.venc||'').slice(0,7)===mes),semPrev=ab.filter(r=>!r.prev),nh=new Set(D.req.filter(r=>{const f=fornById(r.forn);return !f||f.homol!=='sim'}).map(r=>r.forn)).size;
  const meses=[...new Set(D.req.map(r=>(r.venc||'').slice(0,7)).filter(Boolean))].sort().reverse();
  B.innerHTML='<section class="kpis">'+
   '<div class="kpi acc"><div class="l">A pagar (em aberto)</div><div class="v"><small>R$</small>'+fm(ab.reduce((t,r)=>t+r.valor,0))+'</div><div class="n">'+ab.length+' faturas</div></div>'+
   '<div class="kpi'+(venc.length?' bad':'')+'"><div class="l">Vencidas</div><div class="v"><small>R$</small>'+fm(venc.reduce((t,r)=>t+r.valor,0))+'</div><div class="n">'+venc.length+' faturas</div></div>'+
   '<div class="kpi"><div class="l">Vencem este mês</div><div class="v"><small>R$</small>'+fm(doMes.reduce((t,r)=>t+r.valor,0))+'</div><div class="n">'+doMes.length+' faturas</div></div>'+
   '<div class="kpi'+(semPrev.length?' warn':'')+'"><div class="l">Sem previsão do financeiro</div><div class="v">'+semPrev.length+'</div><div class="n">faturas em aberto</div></div>'+
   (nh?'<div class="kpi warn"><div class="l">Fornecedor não homologado</div><div class="v">'+nh+'</div><div class="n">com  registradas</div></div>':'')+'</section>'+
   '<section class="card"><div class="tools"><input type="search" id="q" placeholder="Buscar fornecedor, fatura ou serviço" value="'+esc(F.q)+'">'+
   '<select id="fs"><option value="">Todas as situações</option>'+['Vencida','Vence em breve','Em dia','Sem previsão','Pago'].map(x=>'<option'+(F.s===x?' selected':'')+'>'+x+'</option>').join('')+'</select>'+
   '<select id="fm"><option value="">Todos os vencimentos</option>'+meses.map(m=>'<option value="'+m+'"'+(F.m===m?' selected':'')+'>'+m.split('-').reverse().join('/')+'</option>').join('')+'</select><span class="cnt" id="cnt"></span></div>'+
   '<div class="tablebox"><table><thead><tr><th>Fornecedor</th><th>Fatura</th><th>Tipo de serviço</th><th class="r">Valor (R$)</th><th>Vencimento</th><th>Previsão de pagamento</th><th>Situação</th><th></th></tr></thead><tbody id="rows"></tbody><tfoot id="foot"></tfoot></table></div></section>';
  $('#q').oninput=e=>{F.q=e.target.value;linhas()};$('#fs').onchange=e=>{F.s=e.target.value;linhas()};$('#fm').onchange=e=>{F.m=e.target.value;linhas()};
  linhas();
}
function linhas(){
  const t=norm(F.q).split(/\s+/).filter(Boolean);
  const L=D.req.filter(r=>{const f=fornById(r.forn);return (!F.s||sit(r)[0]===F.s)&&(!F.m||(r.venc||'').slice(0,7)===F.m)&&(!t.length||t.every(w=>norm((f?f.nome:'')+' '+r.fat+' '+r.tipo+' '+(r.sap||'')).includes(w)))})
    .sort((a,b)=>sit(a)[2]-sit(b)[2]||((a.venc||'9')<(b.venc||'9')?-1:1));
  $('#rows').innerHTML=L.map(r=>{const f=fornById(r.forn),s=sit(r),atras=r.prev&&r.venc&&r.prev>r.venc&&!r.pago;
    return '<tr><td><span class="fn">'+avatar(f)+'<span>'+(f?esc(f.nome):'<span class="muted">(fornecedor removido)</span>')+'</span></span>'+(f&&f.homol!=='sim'?' <span class="pill p-nf" title="Este fornecedor não está homologado">'+HOM[f.homol||'nao'][0]+'</span>':'')+'</td><td>'+esc(r.fat)+(r.sap?'<div class="muted" style="font-size:11.5px">Req. SAP '+esc(r.sap)+'</div>':'')+'</td><td>'+esc(r.tipo)+'</td><td class="r nw">'+fm(r.valor)+'</td><td class="nw '+(s[0]==='Vencida'?'late':'')+'">'+fd(r.venc)+'</td><td class="nw">'+(r.pago?'<span class="muted">pago em '+fd(r.pago)+'</span>':r.prev?fd(r.prev)+(atras?' <span class="pill p-warn" title="Previsão de pagamento depois do vencimento">após venc.</span>':''):'<span class="muted">aguardando</span>')+'</td><td><span class="pill '+s[1]+'">'+s[0]+'</span></td><td class="act"><button class="btn sm" data-e="'+r.id+'">Editar</button> <button class="btn sm dng" data-d="'+r.id+'">Excluir</button></td></tr>'}).join('')||'<tr><td colspan="8" class="empty">Nenhuma requisição com esses filtros.</td></tr>';
  $('#foot').innerHTML=L.length?'<tr><td colspan="3">Total · '+L.length+(L.length===1?' fatura':' faturas')+'</td><td class="r nw">'+fm(L.reduce((x,r)=>x+r.valor,0))+'</td><td colspan="4"></td></tr>':'';
  $('#cnt').textContent=L.length+' de '+D.req.length;
  document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>formReq(b.dataset.e));
  document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>excluir('req',b.dataset.d));
}
function formReq(id){
  if(!D.forn.length){modal('<h3>Cadastre um fornecedor primeiro</h3><p>Para registrar uma requisição é preciso escolher o fornecedor. Vá na aba <b>Fornecedores</b> e cadastre.</p><div class="mb"><button class="btn" id="mx">Fechar</button><button class="btn primary" id="mg">Cadastrar fornecedor</button></div>');$('#mx').onclick=fechar;$('#mg').onclick=()=>{fechar();tab='forn';render();formForn()};return}
  const r=id?D.req.find(x=>x.id===id):{id:'',forn:'',fat:'',valor:'',tipo:'',venc:'',prev:'',pago:'',sap:'',obs:''};
  const fs=D.forn.slice().sort((a,b)=>(a.homol==='sim'?0:1)-(b.homol==='sim'?0:1)||a.nome.localeCompare(b.nome,'pt-BR'));
  modal('<h3>'+(id?'Editar requisição':'Nova requisição')+'</h3><div class="fg">'+
   '<div class="fld full"><label for="rf">Nome do fornecedor *</label><select id="rf"><option value="">Selecione…</option>'+fs.map(f=>'<option value="'+f.id+'"'+(r.forn===f.id?' selected':'')+'>'+esc(f.nome)+(f.homol!=='sim'?' ('+HOM[f.homol||'nao'][0].toLowerCase()+')':'')+'</option>').join('')+'</select><div id="wh"></div></div>'+
   '<div class="fld"><label for="ra">Fatura (referência) *</label><input id="ra" value="'+esc(r.fat)+'" placeholder="Ex.: NF 12345"></div>'+
   '<div class="fld"><label for="rv">Valor (R$) *</label><input id="rv" inputmode="decimal" value="'+(r.valor!==''?esc(String(r.valor).replace('.',',')):'')+'" placeholder="0,00"></div>'+
   '<div class="fld full"><label for="rt">Tipo de serviço *</label><input id="rt" list="tps" value="'+esc(r.tipo)+'" placeholder="Escolha ou digite um novo"><datalist id="tps">'+tiposUsados().map(x=>'<option value="'+esc(x)+'">').join('')+'</datalist></div>'+
   '<div class="fld"><label for="rd">Vencimento *</label><input id="rd" type="date" value="'+esc(r.venc)+'"></div>'+
   '<div class="fld"><label for="rp">Previsão de pagamento (financeiro)</label><input id="rp" type="date" value="'+esc(r.prev)+'"><div class="h">Deixe em branco até o financeiro informar.</div></div>'+
   '<div class="fld"><label for="rs">Nº da requisição no SAP</label><input id="rs" value="'+esc(r.sap||'')+'" placeholder="Opcional"></div>'+
   '<div class="fld"><label for="rg">Pago em</label><input id="rg" type="date" value="'+esc(r.pago||'')+'"><div class="h">Preencha quando a fatura for paga.</div></div>'+
   '<div class="fld full"><label for="ro">Observação</label><textarea id="ro" rows="2">'+esc(r.obs||'')+'</textarea></div></div><div id="er" class="warnbox" hidden></div>'+
   '<div class="mb"><button class="btn" id="mx">Cancelar</button><button class="btn primary" id="ms">Salvar</button></div>');
  const wh=()=>{const f=fornById($('#rf').value);$('#wh').innerHTML=f&&f.homol!=='sim'?'<div class="warnbox">Atenção: este fornecedor está como <b>'+HOM[f.homol||'nao'][0].toLowerCase()+'</b>.</div>':''};$('#rf').onchange=wh;wh();
  $('#mx').onclick=fechar;
  $('#ms').onclick=()=>{
    const o={id:r.id||uid(),forn:$('#rf').value,fat:$('#ra').value.trim(),valor:parseMoney($('#rv').value),tipo:$('#rt').value.trim(),venc:$('#rd').value,prev:$('#rp').value,pago:$('#rg').value,sap:$('#rs').value.trim(),obs:$('#ro').value.trim(),criado:r.criado||new Date().toISOString()};
    const falta=[!o.forn&&'fornecedor',!o.fat&&'fatura',o.valor==null&&'valor',!o.tipo&&'tipo de serviço',!o.venc&&'vencimento'].filter(Boolean);
    if(falta.length){const e=$('#er');e.hidden=false;e.textContent='Preencha: '+falta.join(', ')+'.';return}
    if(id)Object.assign(r,o);else D.req.push(o);
    commit();fechar();render();toast('Requisição salva.');
  };
  setTimeout(()=>{const e=$('#rf');e&&e.focus()},50);
}
/* ----- Fornecedores ----- */
function viewForn(){
  const B=$('#body');
  if(!D.forn.length){B.innerHTML='<div class="card empty"><b>Nenhum fornecedor cadastrado</b>Cadastre os prestadores de serviço e marque se estão <b>homologados</b>. Depois eles aparecem na hora de registrar uma requisição.</div>';return}
  B.innerHTML='<section class="card"><div class="tools"><input type="search" id="q" placeholder="Buscar fornecedor, CNPJ ou serviço" value="'+esc(FF.q)+'"><select id="fh"><option value="">Todas as homologações</option>'+Object.entries(HOM).map(([k,v])=>'<option value="'+k+'"'+(FF.h===k?' selected':'')+'>'+v[0]+'</option>').join('')+'</select><span class="cnt" id="cnt"></span></div>'+
   '<div class="tablebox"><table><thead><tr><th>Fornecedor</th><th>CNPJ</th><th>Homologação</th><th>Serviços prestados</th><th>Contato</th><th class="r"></th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section>';
  $('#q').oninput=e=>{FF.q=e.target.value;lf()};$('#fh').onchange=e=>{FF.h=e.target.value;lf()};lf();
}
function lf(){
  const t=norm(FF.q).split(/\s+/).filter(Boolean);
  const L=D.forn.filter(f=>(!FF.h||(f.homol||'nao')===FF.h)&&(!t.length||t.every(w=>norm(f.nome+' '+(f.cnpj||'')+' '+(f.tipos||[]).join(' ')).includes(w)))).sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));
  $('#rows').innerHTML=L.map(f=>{const h=HOM[f.homol||'nao'],n=D.req.filter(r=>r.forn===f.id).length;
    return '<tr><td><span class="fn">'+avatar(f)+'<b>'+esc(f.nome)+'</b></span></td><td class="nw">'+esc(f.cnpj||'')+'</td><td><span class="pill '+h[1]+'">'+h[0]+'</span>'+(f.dtHomol?'<div class="muted" style="font-size:11.5px">desde '+fd(f.dtHomol)+'</div>':'')+'</td><td>'+esc((f.tipos||[]).join(', '))+'</td><td>'+esc(f.contato||'')+(f.email?'<div class="muted" style="font-size:11.5px">'+esc(f.email)+'</div>':'')+'</td><td class="r">'+n+'</td><td class="act"><button class="btn sm" data-e="'+f.id+'">Editar</button> <button class="btn sm dng" data-d="'+f.id+'">Excluir</button></td></tr>'}).join('')||'<tr><td colspan="7" class="empty">Nenhum fornecedor com esses filtros.</td></tr>';
  $('#cnt').textContent=L.length+' de '+D.forn.length;
  document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>formForn(b.dataset.e));
  document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>excluir('forn',b.dataset.d));
}
function formForn(id){
  const f=id?D.forn.find(x=>x.id===id):{id:'',nome:'',cnpj:'',homol:'sim',tipos:[],contato:'',email:'',dtHomol:todayISO(),obs:''};
  modal('<h3>'+(id?'Editar fornecedor':'Novo fornecedor')+'</h3><div class="fg">'+
   '<div class="fld full"><label for="fn">Nome do fornecedor *</label><input id="fn" value="'+esc(f.nome)+'"></div>'+
   '<div class="fld"><label for="fc">CNPJ</label><input id="fc" value="'+esc(f.cnpj||'')+'" placeholder="Opcional"></div>'+
   '<div class="fld"><label for="fh2">Homologação *</label><select id="fh2">'+Object.entries(HOM).map(([k,v])=>'<option value="'+k+'"'+((f.homol||'nao')===k?' selected':'')+'>'+v[0]+'</option>').join('')+'</select></div>'+
   '<div class="fld full"><label for="ft">Serviços que presta</label><input id="ft" list="tps" value="'+esc((f.tipos||[]).join(', '))+'" placeholder="Separe por vírgula. Ex.: Frete internacional, Seguro"><datalist id="tps">'+tiposUsados().map(x=>'<option value="'+esc(x)+'">').join('')+'</datalist></div>'+
   '<div class="fld"><label for="fo">Contato</label><input id="fo" value="'+esc(f.contato||'')+'"></div><div class="fld"><label for="fe">E-mail</label><input id="fe" type="email" value="'+esc(f.email||'')+'"></div>'+
   '<div class="fld"><label for="fd">Data da homologação</label><input id="fd" type="date" value="'+esc(f.dtHomol||'')+'"></div>'+
   '<div class="fld full"><label>Logo (opcional)</label><div class="lgbox"><div id="lgp"></div><div><input type="file" id="lgf" accept="image/*" style="display:none"><button class="btn sm" type="button" id="lgb">Escolher imagem</button> <button class="btn sm dng" type="button" id="lgr">Remover</button><div class="h">PNG ou JPG. A imagem é reduzida automaticamente.</div></div></div></div>'+
   '<div class="fld full"><label for="fb">Observação</label><textarea id="fb" rows="2">'+esc(f.obs||'')+'</textarea></div></div><div id="er" class="warnbox" hidden></div>'+
   '<div class="mb"><button class="btn" id="mx">Cancelar</button><button class="btn primary" id="ms">Salvar</button></div>');
  $('#mx').onclick=fechar;
  let logo=f.logo||'';const pv=()=>{$('#lgp').innerHTML=avatar({nome:$('#fn').value||'?',logo});$('#lgr').style.display=logo?'':'none'};pv();$('#fn').addEventListener('input',()=>{if(!logo)pv()});
  $('#lgb').onclick=()=>$('#lgf').click();$('#lgr').onclick=()=>{logo='';pv()};
  $('#lgf').onchange=async e=>{const fl=e.target.files[0];if(!fl)return;try{logo=await reduzir(fl,128);pv()}catch(x){toast('Não foi possível ler essa imagem.')}};
  $('#ms').onclick=()=>{
    const nome=$('#fn').value.trim();if(!nome){const e=$('#er');e.hidden=false;e.textContent='Preencha o nome do fornecedor.';return}
    if(!id&&D.forn.some(x=>norm(x.nome)===norm(nome))){const e=$('#er');e.hidden=false;e.textContent='Já existe um fornecedor com esse nome.';return}
    const o={id:f.id||uid(),nome,cnpj:$('#fc').value.trim(),homol:$('#fh2').value,tipos:$('#ft').value.split(',').map(x=>x.trim()).filter(Boolean),contato:$('#fo').value.trim(),email:$('#fe').value.trim(),dtHomol:$('#fd').value,obs:$('#fb').value.trim(),logo};
    if(id)Object.assign(f,o);else D.forn.push(o);
    commit();fechar();render();toast('Fornecedor salvo.');
  };
  setTimeout(()=>{const e=$('#fn');e&&e.focus()},50);
}
function excluir(k,id){
  const it=(k==='req'?D.req:D.forn).find(x=>x.id===id);if(!it)return;
  const n=k==='forn'?D.req.filter(r=>r.forn===id).length:0;
  modal('<h3>Excluir '+(k==='req'?'requisição':'fornecedor')+'?</h3><p>'+(k==='req'?esc((fornById(it.forn)||{}).nome||'')+' · '+esc(it.fat):esc(it.nome))+'</p>'+(n?'<div class="warnbox">Este fornecedor tem '+n+' requisição(ões) registrada(s). Elas continuarão na lista, mas sem o nome do fornecedor.</div>':'')+'<div class="mb"><button class="btn" id="mx">Cancelar</button><button class="btn primary" id="md">Excluir</button></div>');
  $('#mx').onclick=fechar;$('#md').onclick=()=>{if(k==='req')D.req=D.req.filter(x=>x.id!==id);else D.forn=D.forn.filter(x=>x.id!==id);commit();fechar();render();toast('Excluído.')};
}
function modal(h){$('#modal').innerHTML=h;$('#ov').hidden=false}
function fechar(){$('#ov').hidden=true;$('#modal').innerHTML=''}
$('#ov').addEventListener('mousedown',e=>{if(e.target===$('#ov'))fechar()});
addEventListener('keydown',e=>{if(e.key==='Escape')fechar()});
boot();
</script>
</body>
</html>
